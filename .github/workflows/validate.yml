name: Validazione

# HACS pretende che questi controlli passino senza errori e senza eccezioni
# ignorate prima di accettare il repository nello store predefinito. La
# release valida e' quella creata DOPO un'esecuzione andata a buon fine.
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Lunedi alle 4: intercetta le rotture dovute a novita' di Home Assistant
    # e non a modifiche nostre.
    - cron: "0 4 * * 1"

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Controlli HACS
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Controlli Home Assistant
        uses: home-assistant/actions/hassfest@master
